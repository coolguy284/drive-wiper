[package]
name = "windows-drives"
version = "0.5.0"
authors = ["Max von Forell <max@vonforell.de>"]
license = "MIT"
repository = "https://sr.ht/~mvforell/windows-drives"
documentation = "https://docs.rs/windows_drives"
description = "Safe Win32 API wrappers for access to raw binary data on physical drives"
keywords = ["windows", "win32", "filesystem", "drive", "disk"]
categories = ["os::windows-apis", "filesystem"]
readme = "README.md"
edition = "2018"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["aarch64-pc-windows-msvc", "i686-pc-windows-msvc", "x86_64-pc-windows-msvc"]

[lib]
name = "windows_drives"
path = "./src/lib.rs"

[dependencies]
derive-try-from-primitive = "1.0.0"
winapi = { version = "0.3", features = ["errhandlingapi", "fileapi", "handleapi", "impl-default", "ioapiset", "minwinbase", "ntdef", "winbase", "winioctl", "winnt"] }
