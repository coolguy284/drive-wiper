[package]
name = "drive-wiper"
version = "0.1.0"
edition = "2024"

[registry]
# To protect against supply-chain attacks:
global-min-publish-age = "7 days"

[dependencies]
atomic-write-file = "0.3.1"
cli-prompts = "0.1.1"
json = "0.12.4"

# https://stackoverflow.com/questions/51821451/how-to-use-a-crate-only-for-a-given-platform/51821632#51821632
[target.'cfg(target_os = "windows")'.dependencies]
regex = "1.13.1"
#windows-drives = "0.5.0"
windows-drives = { path = "windows-drives" }
